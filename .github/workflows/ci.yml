name: native-package-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record actual runner and source
        shell: bash
        run: |
          mkdir -p build
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          record = {"source_sha": os.environ["GITHUB_SHA"], "architecture": platform.machine(),
                    "runner_os": os.environ.get("RUNNER_OS"),
                    "image_os": os.environ.get("ImageOS"), "image_version": os.environ.get("ImageVersion")}
          Path("build/runner-evidence.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, sort_keys=True))
          PY
      - name: Prepare official closure and run isolated native package gates
        shell: bash
        run: sh scripts/check.sh
